<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>variantly</title>
    <link rel="icon" href="/__variantly/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/__variantly/app.css" />
    <script>
      // Theme and reading aids before first paint, so nothing flashes.
      (function () {
        try {
          var m = function (q) { return matchMedia(q).matches; };
          var p = Object.assign(
            { theme: m('(prefers-color-scheme: dark)') ? 'dark' : 'light', motion: m('(prefers-reduced-motion: reduce)') ? 'calm' : 'full' },
            JSON.parse(localStorage.getItem('variantly:prefs') || '{}'),
          );
          var d = document.documentElement;
          d.dataset.theme = p.theme;
          d.dataset.motion = p.motion;
          d.dataset.readable = !!p.readable;
          d.dataset.large = !!p.large;
          d.dataset.contrast = !!p.contrast;
          d.dataset.calm = !!p.calm;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/__variantly/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <header class="bar">
      <a class="wordmark" href="/" aria-label="variantly home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="4" height="16" /><rect x="9" y="4" width="2" height="16" /><rect x="13" y="4" width="4" height="16" /><rect x="19" y="4" width="2" height="16" /></svg>
        variantly
      </a>
      <span class="bar-project" id="project"></span>
      <span class="bar-phase" id="phase" aria-live="polite"></span>
      <span class="bar-spacer"></span>
      <div class="prefs" id="prefs"></div>
    </header>
    <main id="view" tabindex="-1"></main>
    <ol id="toasts" class="toasts" aria-live="polite"></ol>
  </body>
</html>
