name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: CLI · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      # The audit test fetches its packages through `npx --yes`. On a cold
      # cache that install can fail mid-test (most often on Windows), so fill
      # the npx cache up front, retrying a flaky download.
      - name: Warm the npx cache for the audit packages
        shell: bash
        run: |
          pkgs=$(node -e "import('./src/checks.mjs').then((m) => console.log(m.AUDIT_PACKAGES.map((p) => '-p ' + p).join(' ')))")
          for i in 1 2 3; do npx --yes $pkgs -c "node --version" && break; sleep 5; done
      - run: npm test
        env:
          # On the Windows runners, npx installs Lighthouse's dependencies
          # incompletely (missing @puppeteer/browsers files), so the scoring
          # test fails there for reasons outside variantly. Ubuntu and macOS
          # still run it.
          VARIANTLY_SKIP_AUDIT: ${{ runner.os == 'Windows' && '1' || '' }}
      - name: Smoke-test the published tarball
        shell: bash
        run: |
          npm pack --silent
          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/variantly-*.tgz
          npx variantly --version
          npx variantly --help | head -3

  ui:
    name: UI (Next.js static export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: test -f out/index.html

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  demo-scores:
    name: Site demo scores are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scoring takes a few minutes, so only run it when something it
      # depends on changed.
      - name: Check for demo changes
        id: changed
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          if git diff --quiet "$base" HEAD -- site/public/demo site/lib/demo-scores.json site/scripts/score-demo.mjs src/audit-runner.mjs src/checks.mjs 2>/dev/null; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
      - name: Re-score the demo pages
        if: steps.changed.outputs.run == 'true'
        run: node site/scripts/score-demo.mjs --check
